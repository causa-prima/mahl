[mutmut]
source_paths=prozesscode/
pytest_add_cli_args_test_selection=tests/
also_copy=.claude/
        docs/
        features/
        CLAUDE.md
        ruff.toml
        jscpd.config.json

# Seit pytest-cov 7 misst nur coverage selbst Code in Unterprozessen mit (Hooks, Wrapper,
# per Prozessstart getestet) – ohne den Patch fehlten sie still in der Zahl von coverage-run.
[coverage:run]
patch = subprocess

[tool:pytest]
testpaths = tests
markers =
    aufrufpfad(*werkzeuge): prüft den echten Aufrufpfad (main/check/Prozessstart) der genannten Werkzeuge – s. tests/test_aufrufpfad.py

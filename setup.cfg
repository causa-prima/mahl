[mutmut]
source_paths=prozesscode/
pytest_add_cli_args_test_selection=tests/
also_copy=.claude/
        docs/
        features/
        CLAUDE.md
        ruff.toml
        jscpd.config.json
# Zeitlimit je Mutant = (geschätzte Testzeit + timeout_constant) × 15 Sekunden Wanduhr, danach
# SIGXCPU – wie beim CPU-Limit, die beiden sind am Exit-Code nicht zu unterscheiden. Die
# Schätzung stammt aus dem Stats-Lauf und liegt bei Tests, die je Mutant teuer aufsetzen, weit
# unter der echten Dauer (jenga_score.main: 0,6 s geschätzt, 10–12 s gelaufen). Beim Vorgabewert
# 1 riss das unter voller Parallelität sporadisch das Limit, und die Timeouts erschienen als
# Sprung im Bruch der Sperrklinke.
timeout_constant = 5

# Seit pytest-cov 7 misst nur coverage selbst Code in Unterprozessen mit (Hooks, Wrapper,
# per Prozessstart getestet) – ohne den Patch fehlten sie still in der Zahl von coverage-run.
[coverage:run]
patch = subprocess

[tool:pytest]
testpaths = tests
markers =
    aufrufpfad(*werkzeuge): prüft den echten Aufrufpfad (main/check/Prozessstart) der genannten Werkzeuge – s. tests/test_aufrufpfad.py

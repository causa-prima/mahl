services:
  # PostgreSQL Datenbank
  postgres:
    image: postgres:18-alpine
    container_name: mahl-postgres
    restart: unless-stopped
    # Init-Config (POSTGRES_INITDB_ARGS) aus der Single Source, die auch der Testcontainer liest
    # (CM-S105-1) -> Locale/Encoding können nicht zwischen Test und Prod divergieren (LL-S105-1).
    env_file:
      - config/postgres.env
    environment:
      POSTGRES_DB: mahl
      POSTGRES_USER: mahl_user
      POSTGRES_PASSWORD: mahl_dev_password
    ports:
      - "5432:5432"
    volumes:
      # Persistente Daten (bleibt erhalten nach Container-Neustart). Ab Postgres 18 liegt das
      # Datenverzeichnis versionsabhängig darunter (/var/lib/postgresql/18/docker) – gemountet
      # wird deshalb die Ebene darüber, sonst bleibt beim Neuanlegen des Containers nichts erhalten.
      - postgres_data:/var/lib/postgresql
      # Optional: Seed-Data beim ersten Start laden
      # - ./Server/Data/SeedData.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahl_user -d mahl"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin für visuelle Datenbank-Verwaltung
  # Entkommentieren falls benötigt
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: mahl-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@mahl.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_CONFIG_SERVER_MODE: 'False'
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  # Je Hauptversion ein eigenes Volume: Die Datendateien einer anderen Hauptversion kann der
  # Server nicht öffnen.
  postgres_data:
    name: mahl_postgres18_data

networks:
  default:
    name: mahl_network
